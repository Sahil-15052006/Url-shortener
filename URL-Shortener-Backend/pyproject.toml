[project]
name = "url-shortener"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "pathlib>=1.0.1",
    "prisma>=0.15.0",
    "pydantic>=2.13.5",
    "redis>=8.1.0",
    "upstash-redis>=1.8.0",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
